<title>今日任务 · 背单词</title>
<style>

  main{max-width:700px;margin:0 auto;padding:12px 12px 44px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .card.new{border-left:4px solid var(--mo)}

  .tag.mo{background:#fdecec;color:var(--mo)}
  .b{font-size:15px;font-weight:700;color:var(--navy)}

        padding:4px 9px;margin:0 6px 7px 0;background:#fff;cursor:pointer;
        font-size:13.5px;vertical-align:top;transition:background .12s}
  .chip:active{background:#eef4fb}
  .chip .q{font-weight:600}
  .chip.mo .q{color:var(--mo)} .chip.ren .q{color:var(--ren)}

  .chip .ipa{display:none;color:#9aa3af;font-size:11.5px}
  .chip.rev .ipa{display:inline}
  .chip .j{display:none;gap:3px}
  .chip.rev .j{display:inline-flex}

  .chip .j button.y{border-color:#bfe3cd;color:#0f7a44}
  .chip .j button.n{border-color:#f0c7c2;color:#b3392b}
  .chip.ok{background:#eef9f1;border-color:#bfe3cd}
  .chip.bad{background:#fdecea;border-color:#f0c7c2}
  .chip.judged{cursor:default}
  .chip.judged .j{display:none!important}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  button{font:inherit;font-size:13.5px;padding:8px 14px;border-radius:9px;cursor:pointer;
         border:1px solid #cfd8e3;background:#fff;color:#28323f}
  button.primary{background:#1f4e79;border-color:#1f4e79;color:#fff}
  button.ok{background:#0f9d58;border-color:#0f9d58;color:#fff}
  button:disabled{opacity:.45;cursor:default}
  button.small{font-size:12px;padding:4px 10px}
  .bar{height:10px;background:#e9eef5;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#2e75b6,#1f4e79)}
  .kpi{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
  .kpi b{color:var(--navy);font-size:15px}
  .note{font-size:12.5px;color:var(--muted);margin-top:6px}
  .empty{padding:30px;text-align:center;color:#9aa3af}
  .seg{display:inline-flex;border:1px solid #cfd8e3;border-radius:9px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 11px;font-size:13px}
  .seg button+button{border-left:1px solid #cfd8e3}
  .seg button.on{background:#1f4e79;color:#fff}
  .chip.near{background:#fff7e6;border-color:#f5d9a8}
  .chip .in{width:108px;font:inherit;font-size:13px;padding:2px 7px;border:1px solid #dfe4ec;border-radius:6px;background:#fff}
  .chip .in:focus{outline:2px solid #bcd6f2;border-color:#2e75b6}
  .chip .fb{font-size:12px;color:#6b7280}
  .chip .fb.ok{color:#0f7a44} .chip .fb.no{color:#b3392b}
  .story{background:#fbfcfe;border:1px solid #dbe6f2;border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .story h3{margin:0 0 2px;font-size:15px;color:var(--navy)}
  .story .meta2{font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .story p{margin:0;font-size:15px;line-height:1.95}
  .story b{color:#1f4e79;background:#eef4fb;border-radius:3px;padding:0 2px;cursor:pointer;font-weight:600}
  .story b:active{background:#d8e7f8}
  .badlist{background:#fff;border:1px solid #f0c7c2;border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .badlist .t{font-size:13px;color:#b3392b;font-weight:700}
</style>
</head>

</main>

var PASS = [{"p": 1, "tag": "B001 + B002", "title": "The Exchange Day", "text": "Our school held an **exchange** day last Friday. We met on **campus** at eight **a.m.**, and the **registration** closed at nine **a.m.** Before that, every student had to **register** online. The form asked for name, age and **sex**, so we chose **female** or **male**. A **senior** teacher gave a **lecture** on how to **design** a study plan. I felt **anxious** at first, because the noise outside **annoyed** me. But the **designer** from another **nation** talked about students of different **nationalities**, and their stories made me less **frightened**. It was a **formal** day, but a warm one.", "day": 2, "mode": "group"}, {"p": 2, "tag": "B003 + B004", "title": "My First Week", "text": "My first day at **senior high school** was **awkward**. A tall **guy** next to me kept talking, so I could not **concentrate** on the teacher. **What if** I answered wrong? I took a step **forward** and said hello. He was **outgoing**, and his warm smile **impressed** me and **made an impression** on me. Later we went to **explore** the science building and did an **experiment** together. Our teacher told us to **leave** the bottles **alone**. In **junior high school** I never dared to speak, but here I began to build **confidence**. \"Be **confident**,\" she said, \"and **concentrate on** one thing at a time.\" **At last** the bell rang. I still **look forward to** every Monday.", "day": 4, "mode": "group"}, {"p": 3, "tag": "B005 + B006", "title": "Study Habits", "text": "Every **teenage** student in our class has a study **goal**. My **strategy** is simple: **take notes** in every lesson and **revise** them at night. As a **volunteer** in the reading club, I **organise** a **debate** once a month. My **partner** is a **curious** girl with a lively **personality**; her writing **style** is different from mine. We use **flash cards** — a quick **flash** of a word, then say it. Our **organisation** also runs a **ballet** class. I **prefer** reading **to** watching videos, and I prefer quiet **company**.", "day": 6, "mode": "group"}, {"p": 4, "tag": "B007 + B008", "title": "A Hard Month", "text": "As a **freshman**, I found the first month **confusing**. The **title** of today's **topic** was \"Learn to **Advance**\". **Actually**, the **content** was not hard — I **confused** two words and felt **confused** for a while. Our teacher **recommended** an **advanced** course, so I **signed up**. We **cleaned up** the **greenhouse** and watched the slow **movement** of the plants. The work was **suitable** for beginners, and it was a real **challenge**. Now I want to be **fluent** before I **graduate**.", "day": 8, "mode": "group"}, {"p": 5, "tag": "B009 + B010", "title": "The Class Magazine", "text": "**Obviously**, reading **literature** can **improve** your writing. I was **attracted to** a story about a young **editor** and his **adventure** in the mountains. As the **editor** of our class magazine, I am **responsible for** the **schedule** and share the **responsibility** with two friends. I make an **extra** copy and put it on a **plate** near the door. **Extra-curricular** activities take time, so I **quit** one club. My teacher, an **expert** in **youth** **behaviour**, says every **generation** needs its own **solution**.", "day": 10, "mode": "group"}, {"p": 6, "tag": "B011 + B012", "title": "A Trip to Two Cities", "text": "Many **adults** are **addicted to** their phones; some are real **addicts**. To **focus on** study, I **pack** my phone away. Last summer I went to **Chicago** and **Seoul**. In Seoul I saw an old **castle** on a **narrow** street — it was **amazing**. We stayed in a small flat we **rented**; the **arrangement** was **extremely** simple. The **source** of my **visa** was a travel agency. Next year I want to **apply** to a school there and **apply for** a scholarship. I was **amazed** at how much I learned.", "day": 12, "mode": "group"}, {"p": 7, "tag": "B013 + B014", "title": "The Old Site", "text": "After a long **flight** we reached our **destination**. A **powerful** **emperor** once **took control of** this **site**, and his **empire** is gone, but the **architecture** remains. Our **accommodation** was a **flat** with a **unique** view. The **architect** is famous, and **officials** still **recognise** his **type** of design. We followed a narrow **path**; **other than** us, few people were there. I **admired** the old walls. In the **brochure** we got a **package** of maps.", "day": 14, "mode": "group"}, {"p": 8, "tag": "B015 + B016", "title": "A Package Tour", "text": "We booked a **package tour**. At the hotel we **checked in** at three and **checked out** before noon. I paid with a **credit card** and asked for a bill with every **detail**. Our guide, an old **soldier**, told us how the ancient **civilisation** **made up** this land. **Transport** was cheap, and the local **economy** grew fast. We **hiked** up the hill for a better **view** and saw a **statue** near an old **tomb**; it was built in 100 **BC**, and **economic** growth now protects it. **On request**, the agency will **contact** you.", "day": 16, "mode": "group"}, {"p": 9, "tag": "B017 + B018", "title": "Postcards from Far Away", "text": "Last year my uncle visited **Spain** and **Peru**. He sent us photos of the **Eiffel Tower**, **Neuschwanstein Castle** and the **Andes Mountains**. In Peru he walked to **Machu Picchu**, once the centre of the **Inca Empire**, and saw **Lake Titicaca**, where the **Uros** live. He also flew over **Iceland** and the **Amazon rainforest**. I stayed home, played **soccer** in the **stadium** and worked on my **fitness**. My cousin went to **Disneyland** and sent a book about the **Terracotta Army**. She speaks **Spanish** and once studied in **Cusco**.", "day": 18, "mode": "group"}, {"p": 10, "tag": "B019 + B020", "title": "Sports Meeting", "text": "The sports meeting is the biggest **event** of the year. Our school will **host** it on the **track** and in the **gym**. I **work out** every morning and **sweat** a lot. My friend does **gymnastics**; another plays **badminton** and **boxing**. Last winter we went **skiing** and I joined the **marathon** — a **legend** among students. Our best **athlete** is a **master** of the long jump and **sets an example** for us. **Come along** and cheer; if you train, you can **make it** too. Winning brings **honour** and **glory**, but trying matters more.", "day": 20, "mode": "group"}, {"p": 11, "tag": "B021 + B022", "title": "The Final Match", "text": "Last term our team **competed** in the city **championship**. Our **captain** won a **medal** and became **champion**. Her **determination** gave us **strength**, and her **graceful** moves won every heart. Then her old shoes **fell apart**, and she was **injured** — the **injury** kept her **apart** from the game for weeks. We did not **lose heart** or **give up**. \"It doesn't **make sense** to **pretend** nothing happened,\" she said. She refused to **pretend to** be fine. **Even if** we lose, we will try again. **Failure** is not the end.", "day": 22, "mode": "group"}, {"p": 12, "tag": "B023 + B024", "title": "A Healthier Me", "text": "**Millions** of people watch sports **events**. I **jog** and do **push-ups** every day and keep **slim**. I **cut out** sweet drinks and keep a healthy **diet**. **Rather than** lying on the sofa, I go out **now and then**. **Compared with** last year, I feel less **stress**. One **error** can **make a difference**, so I check my work. Last spring a **tornado** and a long **drought** hit the south; a **landslide** followed. It was a **disaster**, and some people tried to **cheat** with false news. Staying **positive** is **rather** important.", "day": 24, "mode": "group"}, {"p": 13, "tag": "B025 + B026", "title": "The Night the Hill Moved", "text": "A **volcanic eruption** sent ash into the sky. Then a **tsunami** hit the coast, and the **flood** came. Rocks began to **slide**. The earthquake had a **magnitude** of seven. The **rescue** team arrived by **helicopter** and **evacuated** the villagers. The **damage** was huge: the storm could **destroy** a house in minutes. Deaths were few, but the town was **in ruins**. People took **shelter** under a **metal** roof. **As if** by a miracle, one **brick** wall stood. A **crack** ran down it, but we may **ruin** it if we touch. About ninety **percent** of the town was **affected**.", "day": 26, "mode": "group"}, {"p": 14, "tag": "B027 + B028", "title": "After the Storm", "text": "The **typhoon** cut off the **electricity**. Many people were **trapped**; some could hardly **breathe**. Doctors worked hard to **revive** them. The **shock** was great, and people stood **in shock**. Food **supplies** arrived by boat. **In the open air**, families waited. With great **effort**, the town began its **revival**. Old **wisdom** helped: build away from the **volcano** before it can **erupt**, and read the **context** of every warning. A **hurricane** is different from a typhoon, but both make people **suffer**. Most **survived**, and neighbours helped **bury** the worst memories and **unify** the village.", "day": 28, "mode": "group"}, {"p": 15, "tag": "B029 + B030", "title": "The Crash on the Road", "text": "The only **survivor** of the **crash** was a boy. **On hand** was a nurse with a **first aid kit**. She stayed **calm** and **delivered** first **aid**. The **emergency** team arrived and blew a **whistle**. They **swept** the glass away and fixed the water **pipe** and the **tap**. A big **wave** can **sweep away** a car, and a storm can **strike** without warning. The storm had a bad **effect** on the **power** supply for a great **length** of time. **In summary**, keep a **kit** at home and know what to do.", "day": 30, "mode": "group"}, {"p": 16, "tag": "B031 + B032", "title": "How Languages Live", "text": "**Billions** of people speak English as a **native** language or use it as a tool. A good **attitude** is the **major** **factor**. The new **system** is **based** on daily practice. **Despite** **ups and downs**, I keep going. When I meet a word, I **refer to** my dictionary for **reference**. The old temple **dates back to** the Ming **dynasty**. Workers once **carved** a **symbol** on a **bone** and a **shell**, and today we find a wide **variety** of such objects. The **base** of all learning is patience.", "day": 32, "mode": "group"}, {"p": 17, "tag": "B033 + B034", "title": "Words Around Me", "text": "**No matter where** you go, language matters. My grandmother speaks a **dialect**; for her, a **classic** poem is a **means** of comfort. Chinese **characters** and **calligraphy** are part of our culture. From my **point of view**, English is a **global** tool. I **regard** my mother **tongue** as my root. This **semester** I **struggled** with **specific** grammar. The temple was built in 800 **CE**. Every **affair** of daily life — taking the **subway**, buying **petrol** for the car, paying for **gas**, renting an **apartment** — needs words. I **appreciate** that.", "day": 34, "mode": "group"}, {"p": 18, "tag": "B035", "title": "An Equal Chance", "text": "Everyone should have an **equal** chance to learn. A big **gap** still exists between city and country schools. Many parents **demand** better teaching, and some even **beg** for a place. My cousin wore old **pants** to school but never gave up. Building **vocabulary** is slow work. A good **description** helps you remember a word, and stories **relate** new words to your life. Words that **relate to** your own story stick longest.", "day": 36, "mode": "group"}, {"p": 19, "day": 38, "tag": "B036–B038 · 30 词", "title": "Saving an Old Temple", "text": "Our town is proud of its **heritage**. Last year a **committee** was **established** to **preserve** an old **temple** on the **mount**. The **former** owner left no **clue** about the **relics** inside, and the roof was falling in. A student **made a proposal** to **promote** the site, so that people could **take part in** a weekend clean-up. At first some **protested**, but most agreed to **give way to** the plan. A **dam** nearby would **lead to** more water and could **prevent** the ground **from** drying. We had to **balance** tourism and protection, and **keep** that **balance** for years. The work is **likely** to **limit** our **loss**. When we **turn to** the **app** for **application**, the story is there too. Many **creative** students drew it **creatively**, and the **cypress** trees in their pictures still stand.", "mode": "group"}, {"p": 20, "day": 41, "tag": "B039–B041 · 30 词", "title": "A Fund for a Pyramid", "text": "Last month our school **department** started a **fund** for an old **pyramid** **overseas**. Every student could **contribute**, and even a small **contribution** helped. We **donated** books and money **to** the project, and we **made sure** every **document** was correct. A **professional** **archaeologist** came to **investigate** the **issue** and to **conduct** a survey. She showed us a **sheet** of photos: a **parade**, a broken **mirror**, and a **roof** with a **Chiwen** and a **dragon**. We could **download** her report **within** a week. Some old customs have **disappeared**, she said, and it is **worthwhile** to **attempt** to save them. A **republic** should keep its story. At the **entrance** the queue was long, so we left by the **exit** after the whole **process**.", "mode": "group"}, {"p": 21, "day": 44, "tag": "B042–B044 · 30 词", "title": "Lists and Images", "text": "**All over the world** people try to protect **historic** places. **UNESCO** lists the **Aswan Dam** and **the Nile** in **Egypt**, the **Kremlin** in **Moscow**, **Saint Basil's Cathedral**, **the Forbidden City**, and sites in **Cairo**, **Tanzania** and **Los Angeles**. A **digital** **image** of each is kept **forever**. In my **opinion**, a **poster** can teach a **tradition** better than a **cave** wall drawing, and the **quality** of the printing matters. We **quote** the text, then **paraphrase** it; a **comparison** or **contrast** helps us **identify** the main idea and take it **further** **throughout** the project. I will not **forgive** myself if I mix them up.", "mode": "group"}, {"p": 22, "day": 47, "tag": "B045–B047 · 30 词", "title": "Animals in Danger", "text": "Many **species** are in danger. **Illegal** hunting continues, and animals are killed **illegally** every day. A **hunter** may sell a **shark** **fin** at a high **rate**. **On average**, a **mass** of forest disappears every minute, and the **habitat** shrinks. Scientists are **concerned about** the **alarming** **rating** of **extinction**; once a species is **extinct**, it is gone for good. We must be **aware** of this and **aware of** our own habits. A **prince** of a small country **made progress** in protecting his **living** land. What **concerns** me most is that animals must **adapt**, or they will **die out** and **endanger** the whole food chain. This is an **alarm** for us all, and we should act **immediately**.", "mode": "group"}, {"p": 23, "day": 50, "tag": "B048–B050 · 30 词", "title": "On the High Plain", "text": "The **Tibetan antelope** lives on the high **plain**. Rangers **watch over** the **herd** **day and night**. From far away you can hardly **make out** a single animal. Poachers **shoot** them for their **fur**, which is a serious **threat**; the trade **threatens** every **reserve**, and some **intend** to **attack** the guards. The local **authority** took **effective** **measures**: they **removed** the traps and **observed** every truck. Under **pressure**, the market shrank. The **beauty** of the plain **reminds** me **of** a **sacred** place. The animals slowly **recovered** and **adapted to** the new rules. A **whale** in the sea faces the same pressure, and both must **exist** beside us — their **profit** cannot come first.", "mode": "group"}, {"p": 24, "day": 53, "tag": "B051–B053 · 30 词", "title": "My Nature Blog", "text": "We live in **harmony** with nature in our **neighbourhood**. With **binoculars** and a **bird field guide**, we **search for** every **creature**: a **deer**, a **kangaroo** in the zoo, even an **insect** on a **net**. My **blog** has a **blog post** about the **Yangtze River dolphin**, and another **blogger** wrote about a **dolphin** and a **koala**. **Due to** warming, their numbers **reduce**. That **stirs up** strong **emotion** in me. An **unusual** animal in **Tibet** — a **Tibetan** fox — was caught on camera by a reader who had just learned to **chat** online. I use a **search engine** every day; it is the quiet **engine** that drives my little site.", "mode": "group"}, {"p": 25, "day": 56, "tag": "B054–B056 · 30 词", "title": "A Day Without Wi-Fi", "text": "**Now that** I have **access** to the Internet, life is more **convenient**. I **surf** the web, **stream** a film and **update** my **database**. The **software** runs on a **network** that covers the whole **province**. Yesterday my phone's **battery** died and I was **stuck** without **Wi-Fi**. I **pressed** the **button**, **confirmed** my **identity** with an **identity card**, and paid in **cash** at the **conference** desk. A **resident** nearby **kept me company**. **Plus**, a **charity** helped me **get through** the **tough** hours. The main **function** is simple: it can **inspire** you at any **distance**, and you **benefit** from it.", "mode": "group"}, {"p": 26, "day": 59, "tag": "B057–B059 · 30 词", "title": "Rules of the Web", "text": "On **the World Wide Web**, **privacy** matters. A **troll** or a **cyberbully** may **make fun of** others and post **false** news; that is **rude** and leaves people **upset**. **Theft** of an **account** is a real **case**. Follow one **guideline**: **keep in mind** that anyone can be a **target**. A **particular** **file** can be stolen in a second — just **click**, and it is gone. The **author** gives one **tip**: keep your data **in shape** and **keep track of** every **discount** offer. If something is **embarrassing**, do not share it. **Confucius** and other thinkers built a **philosophy**; a **mansion**, a **cemetery** and a **descendant** all tell that story. We must **define** rules we are **familiar** with.", "mode": "group"}, {"p": 27, "day": 62, "tag": "B060–B062 · 30 词", "title": "A Kingdom by the Sea", "text": "Every **individual** has a story. A **kingdom** once stood here; its **chief** city had a **port** and a strong **military** **defence**. A **nearby** **gallery** shows how one army tried to **conquer** another in a **battle** that lasted a year. The **location** is **fascinating**. **Keep your eyes open for** **evidence**: a stone **joined to** a wall, a coin that **belongs to** an old **currency**. The **amount** of **legal** work is large, and the **charge** for entry is small. **As well as** tools, they found a shoe **heel** — an **Achilles' heel** of the old city. The **approach** is to **break away from** old ideas, and they will **announce** the **achievement** soon. To me it is still a **puzzle**.", "mode": "group"}, {"p": 28, "day": 65, "tag": "B063–B065 · 30 词", "title": "The Feast", "text": "In our **county** a **feast** is a **custom**. My **ancestors** built the **courtyard** where we sit. A **poet** once wrote about the **landscape** — the **ocean**, the **cattle**, a **dot** of light on the hill. The **scent** of **stew**, **butter** and **honey** fills the air; we **roll** the dough and pour **wine** or **beer** at the **pub** nearby. Music is **classical**, and the **crowd** is **eager** to **greet** guests. It is a **sensory** experience, and the **transition** from day to night is **striking**. We **ensure** every guest has a **snack** and a good **position**. Our host is **generous**, and his **roar** of laughter can be heard across the yard.", "mode": "group"}, {"p": 29, "day": 68, "tag": "B066–B068 · 30 词", "title": "The School Band", "text": "Our school **band** plays **hip-hop** and **techno** with real **energy**. One player uses a **stringed instrument**; another brings **bagpipes** — an unusual mix. A **virtual choir** is different: singers record at home in a **studio** and are put **onto** one track. That is a new **phenomenon**, and it **enables** **ordinary** people to **perform**. Our **composer** wrote an **original** **composition**, and the **conductor** led us onto the **stage**. The **performance** won an **award**, which **proved** that a **performer** needs no big hall. **Altogether** the show was, **thus**, a success. I **fell in love with** music that night — a real **opportunity** for my **soul**.", "mode": "group"}, {"p": 30, "day": 72, "tag": "B069–B072 · 38 词", "title": "My Piano Teacher", "text": "**Nowadays** I play the **piano**, **absorbed in** a **romantic** song from an old **album**. My **previous** teacher was **unemployed** for a year; she had real **talent** but no **equipment**. She had to **set up** a small class to **get through** it. A **gradual** change gave her **relief**. **In addition** to teaching, she wrote an **outline** of a **cure** for a **disease** that causes **ache**; the **treatment** is cheap, and **various** patients report **satisfaction**. **Moreover**, she is **capable** of **leaning** on nobody. I **assume** her **aim** is to **try out** new ideas and measure their **impact** on every **being**. **From then on**, **somehow**, my **reaction** changed: I saw **metaphor**, **personification**, **simile** and **repetition** as more than **rhetorical** tricks.", "mode": "group"}, {"p": 101, "day": 3, "tag": "B002+B003 滑动 · 20 词", "title": "First Morning", "text": "The **senior** students welcomed us on **campus** at nine **a.m.** Our **senior high school** is big, and every room has a **formal** **design**. A tall **guy** next to me kept talking, which began to **annoy** me, but I was too **anxious** to say a word. **What if** the teacher noticed? I could not **concentrate** on the form, so I tried to **concentrate on** one line at a time. After lunch, at two **p.m.**, he said sorry, and his smile **impressed** me — it **made an impression** on me. He is **outgoing**, and I had been **frightened** for nothing. **At last** I felt at home.", "mode": "slide"}, {"p": 102, "day": 5, "tag": "B004+B005 滑动 · 20 词", "title": "In the Lab", "text": "During the **experiment** the teacher told us to **leave** the hot plate **alone**. It was **awkward** at first, because my **junior** partner had never done it in **junior high school**. We went to **explore** the lab, and I felt **confident** enough to **take notes** on every step. A **flash** of light came from the window. She showed me a **flash card** trick to **organise** new words, and our small **organisation** set a clear **goal** and a simple **strategy**. Being **curious** helps, and good **company** helps more. I **look forward to** the next lesson and step **forward** with more **confidence**.", "mode": "slide"}, {"p": 103, "day": 7, "tag": "B006+B007 滑动 · 20 词", "title": "Club Friday", "text": "Every **teenager** in our club has a different **personality** and a different learning **style**. I **revise** my notes after **ballet** class, and I **volunteer** at the weekend. We had a **debate** about whether to **prefer** reading **to** watching videos — most of us do. The **content** of the talk was the slow **movement** of plants in a **greenhouse**. We **cleaned up** the yard first, which was **suitable** work and **suitable for** beginners. **Actually**, the real **challenge** was choosing a **title** for the **topic**.", "mode": "slide"}, {"p": 104, "day": 9, "tag": "B008+B009 滑动 · 20 词", "title": "Reading List", "text": "As a **freshman** I found the reading list **confusing**, and I often **confused** two writers. I was **confused** until my teacher, who will **graduate** next year, **recommended** an **advanced** course; I **signed up** at once. **Obviously**, **literature** takes time, and **extra-curricular** clubs take **extra** hours, so I **quit** one of them. To **advance** my writing I read a few **extra** pages every night. I am **responsible** for my own progress, and the **responsibility** is mine; I must **be responsible for** my choices. My **solution** is simple: read, write, repeat.", "mode": "slide"}, {"p": 105, "day": 11, "tag": "B010+B011 滑动 · 20 词", "title": "The Magazine Editor", "text": "As the **editor** of our magazine, I keep a **schedule** for every story. Last month we ran an **adventure** story by an **expert** on **youth** **behaviour**, and it **attracted** many readers. I was **attracted to** one line about a **generation** that is **addicted to** screens; some are real **addicts**. As an **adult**, I must **focus** and **focus on** one task at a time. That story took us to a **castle** in **Chicago** and to a small flat in **Seoul**. Now I want to **apply** the same idea to my own life.", "mode": "slide"}, {"p": 106, "day": 13, "tag": "B012+B013 滑动 · 20 词", "title": "A Long Flight", "text": "I **applied for** a **visa** and **packed** my bag in one night. The **flight** was **extremely** long. We **rented** a **flat** near a **narrow** street, and the **arrangement** was simple. The **site** was once the home of a **powerful** **emperor**; his **empire** **took control of** the whole valley. An **official** showed us the **type** of stone they used, and I could **recognise** the old marks. It was **amazing**, and I was **amazed** at the **source** of the story.", "mode": "slide"}];

function dayOf(d){
  var ms = new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(START.getFullYear(), START.getMonth(), START.getDate());
  var days = Math.round(ms / 86400000);
  if (days < 0) return { mode: "before", days: days };
  var wk = Math.floor(days / 7), dow = days % 7;
  var n = wk * 5 + Math.min(dow, 4) + 1;
  if (n > 390) return { mode: "after", n: n };
  return { mode: n > STUDY ? "review" : "study", n: n, weekend: dow >= 5, dow: dow };
}

function pad(x){ return x < 10 ? "0" + x : "" + x; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function dateOfN(n){
  var wk = Math.floor((n - 1) / 5), dow = (n - 1) % 5;
  var d = new Date(START.getFullYear(), START.getMonth(), START.getDate());
  d.setDate(d.getDate() + wk * 7 + dow);
  return d;
}

function batchWords(b){ return WORDS.filter(function(x){ return x.b === b; }); }

function norm(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
}
function lev(a,b){
  if (a===b) return 0;
  var m=a.length, n=b.length, i, j, prev=[], cur=[];
  for (j=0;j<=n;j++) prev[j]=j;
  for (i=1;i<=m;i++){
    cur=[i];
    for (j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function writeHTML(x){
  var v = st.write ? st.write[x.i] : undefined;
  var cls = "chip wchip";
  if (v===1) cls += " ok judged";
  else if (v===0) cls += " bad judged";
  else if (v===2) cls += " near judged";
  var fb = "";
  if (v===1) fb = '<span class="fb ok">✓</span>';
  else if (v===2) fb = '<span class="fb no">差一点 · ' + esc(x.w) + '</span>';
  else if (v===0) fb = '<span class="fb no">✗ · ' + esc(x.w) + '</span>';
  return '<span class="' + cls + '" data-i="' + x.i + '">' +
    '<span class="q">' + esc(firstCN(x.cn, 14)) + '</span>' +
    (v === undefined
      ? '<input class="in" data-in="' + x.i + '" autocomplete="off" autocapitalize="off" ' +
        'autocorrect="off" spellcheck="false" placeholder="拼写">'
      : '') +
    fb + '</span>';
}
function chipHTML(x){
  if (st.dir === "write") return writeHTML(x);
  var q = st.dir === "e2c" ? x.w : firstCN(x.cn, 14);
  var a = st.dir === "e2c" ? x.cn : x.w;
  var ip = st.dir === "e2c" ? x.p : "";
  var cls = "chip" + (st.dir === "e2c" && x.c === "必默" ? " mo" : (st.dir === "e2c" && x.c === "必认" ? " ren" : ""));
  var j = st.judge[x.i];
  if (j === 1) cls += " ok judged"; else if (j === 0) cls += " bad judged";
  return '<span class="' + cls + '" data-i="' + x.i + '">' +
    '<span class="q">' + esc(q) + '</span>' +
    '<span class="ipa">' + esc(ip) + '</span>' +
    '<span class="a">' + esc(a) + '</span>' +
    '<span class="j"><button class="y" data-y="' + x.i + '">✓</button>' +
    '<button class="n" data-n="' + x.i + '">✗</button></span>' +
  '</span>';
}
function firstCN(cn, max){
  var s = String(cn || "");
  var p = s.split(/[；;，,]/)[0];
  max = max || 8;
  return p.length > max ? p.slice(0, max) + "…" : p;
}

function render(){
  var el = document.getElementById("list"), sub = document.getElementById("subtitle"),
      note = document.getElementById("note"), btn = document.getElementById("btnDone");
  var html = "", total = 0;

  if (info.mode === "before"){
    document.getElementById("title").textContent = "还没开始";
    sub.textContent = "距离 11 月 2 日（第 1 天）还有 " + (-info.days) + " 天";
    el.innerHTML = '<div class="card"><div class="note">先做两件事：① 把必修一 349 个词过一遍“见词知义”；② 每天读一段英语，找找语感。</div></div>';
    btn.disabled = true; updateKPI(); return;
  }
  if (info.mode === "after"){
    document.getElementById("title").textContent = "计划已走完";
    sub.textContent = "390 个学习日全部结束，进入自主复习";
    el.innerHTML = '<div class="card"><div class="note">用「随机抽测」每周过两遍，错词抄进错词本。</div></div>';
    btn.disabled = true; updateKPI(); return;
  }

  var n = info.n, dd = dateOfN(n);
  document.getElementById("title").textContent = info.weekend ? "今天复习（周末不学新词）" : "第 " + n + " 天 · 今日任务";
  sub.textContent = (force ? "预览模式 · " : "") + fmt(dd) + " " + WD[(n - 1) % 5] + " ｜ " +
    (info.weekend ? "周末只复习" : ("新词 " + PER + " 个 + 复习 5 批"));

  if (st.done[n]) { btn.textContent = "今天已完成 ✓"; btn.classList.add("ok"); btn.classList.remove("primary"); }
  else { btn.textContent = "今天完成了"; btn.classList.remove("ok"); btn.classList.add("primary"); }

  if (!info.weekend && n <= STUDY){
    html += cardNew(n); total += PER;
  } else if (info.weekend){
    html += '<div class="card"><div class="h"><span class="tag">周末</span><span class="b">不学新词</span></div>' +
            '<div class="note">把本周欠的复习补齐。</div></div>';
  }
  [1,2,4,7,15].forEach(function(off){
    var b = n - off;
    if (b < 1) return;
    html += cardRev(b, off); total += PER;
  });
  if (!info.weekend){
    var story = null;
    if (st.mode === "slide"){
      story = PASS.filter(function(x){ return x.mode === "slide" && x.day === n; })[0]
           || PASS.filter(function(x){ return x.mode === "group" && x.day === n; })[0];
    } else {
      story = PASS.filter(function(x){ return x.mode === "group" && x.day === n; })[0];
    }
    if (story) html += cardStory(story);
  }
  el.innerHTML = html;
  if (st.dir === "write") { note.textContent = "默写模式：看中文拼英文，回车判分。大小写、空格、标点都不算错；差 1–2 个字母算“差一点”。"; }
  else { note.textContent = "今天 " + total + " 词次。先回忆，再点开核对，然后点 ✓ / ✗ 判定。"; }
  bindChips();
  bindStory();
  renderBad(n);
  updateKPI();
}

function cardStory(st){
  var body = esc(st.text).replace(/\*\*([^*]+)\*\*/g, function(_, w){
    return '<b data-sw="' + w + '">' + w + '</b>';
  });
  var plain = st.text.replace(/\*\*/g, "");
  STORY_PLAIN = plain;
  return '<div class="story"><h3>' + esc(st.title) + '</h3>' +
    '<div class="meta2">' + esc(st.tag) + ' ｜ ' + plain.split(/\s+/).length + ' 词 · 点加粗的词单独听</div>' +
    '<p>' + body + '</p>' +
    '<div class="row"><button class="small" id="btnStory">🔊 整篇朗读</button>' +
    '<button class="small" id="btnStorySlow">🐢 慢速朗读</button></div></div>';
}
var STORY_PLAIN = "";

function cardNew(n){
  var ws = batchWords(n), body;
  if (ws && ws.length) body = ws.map(chipHTML).join("");
  else body = '<span class="note">这一批属于必修二以后，词表还没做，先按课本单元背 10 个</span>';
  return '<div class="card new"><div class="h"><span class="tag mo">新词</span>' +
    '<span class="b">B' + pad(n) + '</span><span class="sub">' + PER + ' 个 · 先自己说，再点开</span></div>' +
    '<div class="words">' + body + '</div>' +
    '<div class="row"><button class="small" data-read="' + n + '">🔊 读这一批</button></div></div>';
}

function cardRev(b, off){
  var ws = batchWords(b);
  var label = off === 1 ? "第 1 天" : ("第 " + off + " 天");
  var body = (ws && ws.length) ? ws.map(chipHTML).join("") :
    '<span class="note">B' + pad(b) + '（该册词表待补）</span>';
  return '<div class="card rev"><div class="h"><span class="tag">复习</span>' +
    '<span class="b">B' + pad(b) + '</span><span class="sub">' + label + '复习</span></div>' +
    '<div class="words">' + body + '</div></div>';
}

function bindStory(){
  var b1 = document.getElementById("btnStory"), b2 = document.getElementById("btnStorySlow");
  function read(rate){
    if (!STORY_PLAIN || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(STORY_PLAIN);
    u.lang = "en-US"; u.rate = rate;
    var v = voices.filter(function(x){ return (x.lang||"").toLowerCase().indexOf("en") === 0; })[0];
    if (v) u.voice = v;
    if (b1) { b1.disabled = true; b1.textContent = "朗读中…"; }
    u.onend = u.onerror = function(){ if (b1){ b1.disabled = false; b1.textContent = "🔊 整篇朗读"; } };
    window.speechSynthesis.speak(u);
  }
  if (b1) b1.addEventListener("click", function(){ read(0.92); });
  if (b2) b2.addEventListener("click", function(){ read(0.72); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-sw]"), function(el){
    el.addEventListener("click", function(){ say(el.getAttribute("data-sw")); });
  });
}

function bindChips(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-in]"), function(inp){
    inp.addEventListener("keydown", function(e){
      if (e.key !== "Enter") return;
      e.preventDefault();
      checkWrite(+inp.getAttribute("data-in"), inp.value, inp);
    });
    inp.addEventListener("blur", function(){
      if (inp.value.trim()) checkWrite(+inp.getAttribute("data-in"), inp.value, inp);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){
    c.addEventListener("click", function(e){
      if (e.target.tagName === "BUTTON") return;
      if (c.classList.contains("judged")) return;
      c.classList.toggle("rev");
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-y]"), function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation(); judge(b.getAttribute("data-y"), 1);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-n]"), function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation(); judge(b.getAttribute("data-n"), 0);
    });
  });
}
function checkWrite(i, typed, inp){
  var map = {}; WORDS.forEach(function(x){ map[x.i] = x; });
  var x = map[i]; if (!x) return;
  var a = norm(typed), b = norm(x.w);
  var v;
  if (!a) return;
  if (a === b) v = 1;
  else if (b.length >= 5 && lev(a, b) <= 2) v = 2;
  else v = 0;
  st.write = st.write || {};
  st.write[i] = v; save();
  var chip = inp.closest(".chip");
  var fb;
  if (v === 1) { chip.classList.add("ok"); fb = '<span class="fb ok">✓</span>'; }
  else if (v === 2) { chip.classList.add("near"); fb = '<span class="fb no">差一点 · ' + esc(x.w) + '</span>'; }
  else { chip.classList.add("bad"); fb = '<span class="fb no">✗ · ' + esc(x.w) + '</span>'; }
  chip.classList.add("judged");
  chip.removeChild(inp);
  chip.insertAdjacentHTML("beforeend", fb);
  renderBad(info.n);
  updateSummary();
}

function summaryText(){
  var n = info.n, idx = todayIdx(), ok=0, near=0, bad=0, done=0;
  idx.forEach(function(i){
    var v = (st.dir === "write") ? (st.write||{})[i] : st.judge[i];
    if (v === undefined) return;
    done++;
    if (v === 1) ok++; else if (v === 2) near++; else bad++;
  });
  return { total: idx.length, done: done, ok: ok, near: near, bad: bad };
}
function updateSummary(){
  var s = summaryText(), el = document.getElementById("note");
  if (st.dir === "write"){
    el.textContent = "默写进度 " + s.done + "/" + s.total + " ｜ 全对 " + s.ok +
      " ｜ 差一点 " + s.near + " ｜ 错 " + s.bad;
  }
}

function judge(i, v){
  st.judge[i] = v; save();
  var c = document.querySelector('.chip[data-i="' + i + '"]');
  if (c){ c.classList.add("rev", "judged"); c.classList.toggle("ok", v === 1); c.classList.toggle("bad", v === 0); }
  renderBad(info.n);
  updateKPI();
}

function todayIdx(){
  var n = info.n, out = [];
  if (!info.weekend && n <= STUDY) batchWords(n).forEach(function(x){ out.push(x.i); });
  [1,2,4,7,15].forEach(function(off){
    var b = n - off; if (b >= 1) batchWords(b).forEach(function(x){ out.push(x.i); });
  });
  return out;
}
function renderBad(n){
  var box = document.getElementById("badbox");
  var bad = todayIdx().filter(function(i){
    return (st.dir === "write") ? ((st.write||{})[i] === 0 || (st.write||{})[i] === 2) : (st.judge[i] === 0);
  });
  var map = {}; WORDS.forEach(function(x){ map[x.i] = x; });
  if (!bad.length){ box.innerHTML = ""; return; }
  box.innerHTML = '<div class="badlist"><div class="t">今天没记住的 ' + bad.length + ' 个</div><div class="words">' +
    bad.map(function(i){ return '<span class="chip bad judged"><span class="q">' + esc(map[i].w) +
      '</span><span class="a">' + esc(map[i].cn) + '</span></span>'; }).join("") + '</div></div>';
}
function updateKPI(){
  var keys = Object.keys(st.done).filter(function(k){ return st.done[k]; });
  document.getElementById("kDone").textContent = keys.length;
  var streak = 0, d = (info.mode === "study" || info.mode === "review") ? info.n : 0;
  while (d > 0 && st.done[d]) { streak++; d--; }
  document.getElementById("kStreak").textContent = streak;
  var pct = Math.round(keys.length / STUDY * 1000) / 10;
  document.getElementById("kPct").textContent = pct + "%";
  document.getElementById("kBar").style.width = Math.min(100, pct) + "%";
}

/* 朗读 */
var voices = [];
function loadV(){ voices = (window.speechSynthesis && window.speechSynthesis.getVoices()) || []; }
if (window.speechSynthesis){ loadV(); window.speechSynthesis.onvoiceschanged = loadV; setTimeout(loadV, 400); }
function say(t, cb){
  if (!window.speechSynthesis) return;
  var u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US"; u.rate = 0.85;
  var v = voices.filter(function(x){ return (x.lang||"").toLowerCase().indexOf("en") === 0; })[0];
  if (v) u.voice = v;
  if (cb) u.onend = cb;
  window.speechSynthesis.speak(u);
}
document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("[data-read]") : null;
  if (!b) return;
  var ws = batchWords(+b.getAttribute("data-read")), i = 0;
  if (!ws || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  (function next(){
    if (i >= ws.length) return;
    say(ws[i++].w, function(){ setTimeout(next, 220); });
  })();
});

/* 控件 */
Array.prototype.forEach.call(document.querySelectorAll("#dirBox button"), function(b){
  b.addEventListener("click", function(){
    st.dir = b.getAttribute("data-dir"); save();
    Array.prototype.forEach.call(document.querySelectorAll("#dirBox button"), function(x){ x.classList.toggle("on", x === b); });
    render(); syncRevealBtns(); updateSummary();
  });
  b.classList.toggle("on", b.getAttribute("data-dir") === st.dir);
});
function syncRevealBtns(){
  var w = st.dir === "write";
  document.getElementById("btnRevealAll").style.display = w ? "none" : "";
  document.getElementById("btnHideAll").style.display = w ? "none" : "";
}
document.getElementById("btnRevealAll").addEventListener("click", function(){
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){ if (!c.classList.contains("judged")) c.classList.add("rev"); });
});
document.getElementById("btnHideAll").addEventListener("click", function(){
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){ if (!c.classList.contains("judged")) c.classList.remove("rev"); });
});
document.getElementById("btnDone").addEventListener("click", function(){
  if (info.mode !== "study" && info.mode !== "review") return;
  st.done[info.n] = 1; save(); render();
});
document.getElementById("btnRand").addEventListener("click", function(){
  var pool = WORDS.slice();
  for (var i = pool.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  document.getElementById("list").innerHTML =
    '<div class="card"><div class="h"><span class="tag">抽测</span><span class="b">随机 20 词</span>' +
    '<span class="sub">先回忆，再点开</span></div><div class="words">' +
    pool.slice(0, 20).map(chipHTML).join("") + '</div></div>';
  bindChips();
});
document.getElementById("btnCopyBad").addEventListener("click", function(){
  var bad = todayIdx().filter(function(i){
    return (st.dir === "write") ? ((st.write||{})[i] === 0 || (st.write||{})[i] === 2) : (st.judge[i] === 0);
  });
  if (!bad.length){ alert("今天还没有标 ✗ 的词。"); return; }
  var map = {}; WORDS.forEach(function(x){ map[x.i] = x; });
  var text = bad.map(function(i){ return map[i].w; }).join("、");
  var done = function(){ var b = document.getElementById("btnCopyBad"); b.textContent = "已复制 " + bad.length + " 个"; setTimeout(function(){ b.textContent = "复制今天的生词"; }, 1300); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function(){ fb(text, done); });
  else fb(text, done);
});
function fb(t, done){ var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select();
  try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(a); done(); }

syncRevealBtns();
(function(){
  var host = document.getElementById("btnHideAll");
  var b = document.createElement("button");
  b.id = "btnMode"; b.className = "small";
  function label(){ b.textContent = (st.mode === "slide") ? "短文：滑动" : "短文：分组";
                    b.classList.toggle("on", st.mode === "slide"); }
  label();
  b.addEventListener("click", function(){
    st.mode = (st.mode === "slide") ? "group" : "slide";
    save(); render(); label();
  });
  if (host && host.parentNode) host.parentNode.insertBefore(b, host.nextSibling);
  else document.querySelector("main").appendChild(b);
})();
updateSummary();
render();
</script>
</body>
</html>
